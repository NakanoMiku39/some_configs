[general]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.92
dynamic_padding = false
decorations = "Full"

[window.padding]
x = 14
y = 14

[selection]
save_to_clipboard = true

[cursor]
blink_interval = 500

[cursor.style]
shape = "Block"
blinking = "On"

[font]
size = 12.0

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Regular"

[font.bold_italic]
family = "Fira Code"
style = "Bold"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#83a598"

[colors.vi_mode_cursor]
text = "#282828"
cursor = "#fabd2f"

[colors.selection]
text = "#282828"
background = "#83a598"

[colors.search.matches]
foreground = "#282828"
background = "#fabd2f"

[colors.search.focused_match]
foreground = "#282828"
background = "#b8bb26"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
