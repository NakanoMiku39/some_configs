[main]
font=FiraCode Nerd Font:size=13
terminal=foot
prompt="> "
placeholder=Search applications
icon-theme=Adwaita
icons-enabled=yes
fields=filename,name,generic,exec,categories,keywords
match-mode=fzf
sort-result=yes
show-actions=yes
filter-desktop=no
width=46
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.35
line-height=18
anchor=center
layer=overlay
keyboard-focus=exclusive

[colors]
background=282828e6
text=ebdbb2ff
prompt=83a598ff
placeholder=928374ff
input=fbf1c7ff
match=b8bb26ff
selection=504945ff
selection-text=fbf1c7ff
selection-match=fabd2fff
counter=928374ff
border=83a598ff

[border]
width=2
radius=12
selection-radius=8
