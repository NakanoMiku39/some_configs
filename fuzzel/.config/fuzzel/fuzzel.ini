[main]
font=FiraCode Nerd Font:size=13
terminal=alacritty -e
prompt="> "
placeholder=Search applications
icon-theme=Adwaita
icons-enabled=yes
fields=filename,name,generic,exec,categories,keywords
match-mode=fzf
sort-result=yes
show-actions=yes
filter-desktop=no
width=46
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.35
line-height=18
anchor=center
layer=overlay
keyboard-focus=exclusive

[colors]
background=0f1b35e6
text=dcdfe1ff
prompt=61afefff
placeholder=7f8ca3ff
input=ffffffff
match=98c379ff
selection=1f365fff
selection-text=ffffffff
selection-match=ffd580ff
counter=7f8ca3ff
border=61afefff

[border]
width=2
radius=12
selection-radius=8
