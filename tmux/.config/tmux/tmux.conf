# Prefix
set -g prefix C-g
unbind C-b
bind C-g send-prefix

# Basics
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
setw -g mode-keys vi

# Splits keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Theme
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0c121e,fg=#dce3ee"
set -g status-left-length 48
set -g status-right-length 80
set -g status-left "#[fg=#61afef,bold] #S #[fg=#3f4f68]│"
set -g status-right "#[fg=#3f4f68]│ #[fg=#93a4b8]%m-%d #[fg=#61afef,bold]%H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=#93a4b8] #I:#W "
set -g window-status-current-format "#[fg=#0c121e,bg=#61afef,bold] #I:#W "
set -g window-status-activity-style "fg=#e5c07b,bg=#0c121e"
set -g window-status-bell-style "fg=#0c121e,bg=#e06c75,bold"

set -g pane-border-style "fg=#3f4f68"
set -g pane-active-border-style "fg=#61afef"
set -g display-panes-colour "#3f4f68"
set -g display-panes-active-colour "#61afef"
set -g message-style "fg=#dce3ee,bg=#1f2d46"
set -g mode-style "fg=#0c121e,bg=#61afef"
set -g clock-mode-colour "#61afef"
