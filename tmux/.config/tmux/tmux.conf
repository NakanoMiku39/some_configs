# Prefix
set -g prefix C-g
unbind C-b
bind C-g send-prefix

# Basics
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
setw -g mode-keys vi

# Splits keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Theme
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 48
set -g status-right-length 80
set -g status-left "#[fg=#fabd2f,bold] #S #[fg=#665c54]│"
set -g status-right "#[fg=#665c54]│ #[fg=#a89984]%m-%d #[fg=#fabd2f,bold]%H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=#a89984] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#d79921,bold] #I:#W "
set -g window-status-activity-style "fg=#fabd2f,bg=#282828"
set -g window-status-bell-style "fg=#282828,bg=#cc241d,bold"

set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#d79921"
set -g display-panes-colour "#665c54"
set -g display-panes-active-colour "#d79921"
set -g message-style "fg=#ebdbb2,bg=#3c3836"
set -g mode-style "fg=#282828,bg=#d79921"
set -g clock-mode-colour "#d79921"
